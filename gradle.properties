# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
# This is required to provide enough memory for the Minecraft decompilation process.
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false

## Environment Properties
minecraft_version=1.20.1
minecraft_version_range=[1.20.1,1.21)
forge_version=47.4.10
# Iron's Spellbooks 1.20.1 itself requires Forge 47.4.0+
forge_version_range=[47.4,)
loader_version_range=[47,)
mapping_channel=parchment
mapping_version=2023.09.03-1.20.1

## Dependency Versions
pufferfish_version=8941363
# Iron's Spells 'n Spellbooks (Maven artifact, not CurseForge file ID)
irons_spells_version=1.20.1-3.15.6

# Iron's Spellbooks runtime prerequisites (needed for runClient; ISS hard-deps them)
irons_lib_version=1.20.1-1.1.0
geckolib_version=4.8.4
player_animator_version=1.0.2-rc1+1.20
curios_version=5.14.1+1.20.1

junit_version=5.10.2

